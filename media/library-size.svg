<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Held-out English top five by library size, LEKS 2.0 default against LEKS 3.0 as shipped</title>
<desc id="desc">158 held-out questions grouped by the size of the asking role's library. 35 and 602 notes 46 questions: 2.0 73.9%, 3.0 89.1%; 1,194 to 1,394 notes 64 questions: 2.0 64.1%, 3.0 90.6%; 2,052 and 4,499 notes 48 questions: 2.0 45.8%, 3.0 75.0%.</desc>
<rect x="0.5" y="0.5" width="819" height="349" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">Right note in the top five, by library size</text>
<text x="24.0" y="56.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">158 held-out questions, grouped by how many notes the asking role's library holds</text>
<text x="24.0" y="74.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">Both drop as the library grows. 3.0 drops half as far and leads by 29.2 points in the biggest</text>
<circle cx="30" cy="100" r="6" fill="#6E7781" stroke="#FFFFFF" stroke-width="2"/>
<text x="42.0" y="104.0" font-size="12" fill="#59636E" font-weight="normal" text-anchor="start">LEKS 2.0 default (R1)</text>
