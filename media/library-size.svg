<text x="395.0" y="294.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="middle">25%</text>
<line x1="520.0" y1="128.0" x2="520.0" y2="276.0" stroke="#EAEEF2"/>
<text x="520.0" y="294.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="middle">50%</text>
