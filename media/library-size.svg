<text x="24.0" y="332.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="start">2.0's own test searched one wiki of 91 pages (R1 79.3%). Its distractor test: 10,000 extra pages took R1 from 77.9% to 36.5%</text>
