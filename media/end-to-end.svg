<svg xmlns="http://www.w3.org/2000/svg" width="820" height="506" viewBox="0 0 820 506" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Right answers and passed tasks of a coding agent with LEKS 3.0 and without it</title>
<desc id="desc">End-to-end tests of a coding agent, right answers or passed tasks without LEKS against with LEKS 3.0. 35 project questions, one fresh session per question: 28 of 35 against 32 of 35; Two long sessions, 26 turns each, with a forced compaction: 39 of 52 against 49 of 52; &quot;Was this tried before&quot; turns, inside those two sessions: 1 of 6 against 5 of 6; Ten development tasks, in scratch clones, passed: 7 of 10 against 9 of 10; Three working days, answers, a cold cache every morning: 75 of 100 against 89 of 100; Three working days, tasks, passed: 12 of 14 against 14 of 14.</desc>
