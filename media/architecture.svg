<text x="454.0" y="122.0" font-size="11" fill="#818B98" font-weight="600" text-anchor="start">KNOWLEDGE LAYER</text>
<text x="664.0" y="122.0" font-size="11" fill="#818B98" font-weight="600" text-anchor="start">SEARCH AND DELIVERY</text>
<rect x="34" y="132" width="180" height="44" fill="#F6F8FA" stroke="#D0D7DE"/>
