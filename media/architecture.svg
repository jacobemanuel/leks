<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="568" viewBox="0 0 1180 568" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">LEKS 2.0 architecture</title>
<desc id="desc">On the developer's Mac: source files, evidence layer, knowledge layer, search and delivery, and a band of checks and hooks. Components added in 2.0 are marked. Obsidian and the AI coding agent are separate applications; the agent requests answer packs over MCP, and its model runs locally or in the cloud.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F6F8FA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6E7781" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636E"/></marker></defs>
<rect x="0.5" y="0.5" width="1179" height="567" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">LEKS 2.0: architecture</text>
<text x="24.0" y="54.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">Dashed boundary: the developer's Mac. Grey boxes: LEKS tools and the files they read; a static check of the</text>
<text x="24.0" y="72.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">source finds no networking imports in its Python tools. White boxes: separate applications, with their own network behaviour.</text>
