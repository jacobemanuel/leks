<text x="46.0" y="258.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="start">Blender add-on</text>
<text x="46.0" y="274.0" font-size="11" fill="#59636E" font-weight="normal" text-anchor="start">bounded reference</text>
