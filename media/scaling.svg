<circle cx="313.1" cy="339.3" r="3.5" fill="#0969DA" stroke="#0969DA" stroke-width="1.5"/>
<text x="320.1" y="356.3" font-size="11" fill="#1F2328" font-weight="normal" text-anchor="start" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3.6 ms</text>
<circle cx="388.4" cy="331.6" r="3.5" fill="#0969DA" stroke="#0969DA" stroke-width="1.5"/>
<text x="395.4" y="348.6" font-size="11" fill="#1F2328" font-weight="normal" text-anchor="start" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5.0 ms</text>
<circle cx="700.5" cy="269.7" r="3.5" fill="#0969DA" stroke="#0969DA" stroke-width="1.5"/>
<text x="707.5" y="286.7" font-size="11" fill="#1F2328" font-weight="normal" text-anchor="start" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">68 ms</text>
<line x1="90" y1="422" x2="110" y2="422" stroke="#8C959F" stroke-width="2"/>
<text x="116.0" y="426.0" font-size="12" fill="#59636E" font-weight="normal" text-anchor="start">R0 (1.0): reads every page per query</text>
<line x1="420" y1="422" x2="440" y2="422" stroke="#0969DA" stroke-width="2"/>
<text x="446.0" y="426.0" font-size="12" fill="#59636E" font-weight="normal" text-anchor="start">R1 (2.0): persistent index (100 queries)</text>
<text x="90.0" y="448.0" font-size="11.5" fill="#59636E" font-weight="normal" text-anchor="start">R0 was timed on the first 20 of R1's 100 questions, and on the first 3 at 10,027 pages (dashed, hollow: indicative only).</text>
</svg>
