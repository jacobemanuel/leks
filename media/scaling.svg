<svg xmlns="http://www.w3.org/2000/svg" width="820" height="466" viewBox="0 0 820 466" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Search latency against knowledge-base size, R0 and R1</title>
<desc id="desc">Log-log chart. R1 p95: 2.3 ms at 91 pages, 3.6 ms at 347, 5.0 ms at 667, 68 ms at 10,027. R0 p95: 333 ms, 1.3 s and 2.9 s on 20 queries, and 21.9 s on only 3 queries (indicative).</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F6F8FA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6E7781" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636E"/></marker></defs>
<rect x="0.5" y="0.5" width="819" height="465" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">Search latency against knowledge-base size</text>
<text x="24.0" y="56.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">95th percentile per query, warm, one process; pages beyond 91 are synthetic, built from real sentences.</text>
<text x="24.0" y="74.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">Both axes are logarithmic.</text>
<line x1="90" y1="370.0" x2="780" y2="370.0" stroke="#EAEEF2"/>
