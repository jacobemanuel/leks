<text x="82.0" y="100.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="end">100 s</text>
<line x1="159.0" y1="96" x2="159.0" y2="370" stroke="#EAEEF2"/>
<text x="159.0" y="388.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="middle">91</text>
<line x1="313.1" y1="96" x2="313.1" y2="370" stroke="#EAEEF2"/>
<text x="313.1" y="388.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="middle">347</text>
<line x1="388.4" y1="96" x2="388.4" y2="370" stroke="#EAEEF2"/>
<text x="388.4" y="388.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="middle">667</text>
