<circle cx="159.0" cy="231.8" r="3.5" fill="#8C959F" stroke="#8C959F" stroke-width="1.5"/>
<text x="166.0" y="248.8" font-size="11" fill="#1F2328" font-weight="normal" text-anchor="start" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">333 ms  (20 queries)</text>
