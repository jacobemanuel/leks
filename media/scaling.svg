<text x="82.0" y="319.2" font-size="11" fill="#818B98" font-weight="normal" text-anchor="end">10 ms</text>
<line x1="90" y1="260.4" x2="780" y2="260.4" stroke="#EAEEF2"/>
<text x="82.0" y="264.4" font-size="11" fill="#818B98" font-weight="normal" text-anchor="end">100 ms</text>
<line x1="90" y1="205.6" x2="780" y2="205.6" stroke="#EAEEF2"/>
<text x="82.0" y="209.6" font-size="11" fill="#818B98" font-weight="normal" text-anchor="end">1 s</text>
