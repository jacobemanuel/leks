<text x="700.5" y="388.0" font-size="11" fill="#818B98" font-weight="normal" text-anchor="middle">10,027</text>
<text x="435.0" y="408.0" font-size="12" fill="#59636E" font-weight="normal" text-anchor="middle">pages</text>
