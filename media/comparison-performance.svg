<text x="936.0" y="363.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="end">20 times less</text>
<line x1="24" y1="392" x2="936" y2="392" stroke="#EAEEF2"/>
<text x="24.0" y="417.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="start">MCP server memory, steady</text>
