<text x="480.2" y="323.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">102 ms</text>
<text x="936.0" y="309.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="end">2.9 times faster</text>
<line x1="24" y1="338" x2="936" y2="338" stroke="#EAEEF2"/>
<text x="24.0" y="363.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="start">Full integrity check, peak memory</text>
<rect x="330" y="348" width="420.0" height="13" fill="#8C959F"/>
