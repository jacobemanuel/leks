<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Version 1.0 with R0 against version 2.0 with R1: latency and memory</title>
<desc id="desc">Paired horizontal bars on the same 217 questions. Page search p95 351 ms against 2.0 ms; answer pack p95 379 ms against 37 ms; through MCP 371 ms against 37 ms; new process median 297 ms against 102 ms; full check peak memory 1,602 MB against 82 MB; MCP server memory 42 MB against 51 MB.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F6F8FA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6E7781" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636E"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="489" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="24.0" y="36.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">Version 1.0 with R0 and version 2.0 with R1</text>
<text x="24.0" y="60.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">Same machine, same knowledge base snapshot, same 217 questions; warm runs.</text>
<text x="24.0" y="79.0" font-size="13" fill="#59636E" font-weight="normal" text-anchor="start">Each row is scaled to its own larger value. Shorter is better.</text>
<rect x="24" y="96" width="14" height="10" fill="#8C959F"/>
<text x="44.0" y="105.0" font-size="12" fill="#59636E" font-weight="normal" text-anchor="start">1.0 (R0)</text>
<rect x="120" y="96" width="14" height="10" fill="#0969DA"/>
<text x="140.0" y="105.0" font-size="12" fill="#59636E" font-weight="normal" text-anchor="start">2.0 (R1, deployed)</text>
<text x="936.0" y="105.0" font-size="12" fill="#59636E" font-weight="normal" text-anchor="end">Change</text>
<line x1="24" y1="122" x2="936" y2="122" stroke="#EAEEF2"/>
<text x="24.0" y="147.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="start">Page search, p95</text>
<rect x="330" y="132" width="420.0" height="13" fill="#8C959F"/>
<text x="756.0" y="143.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">351 ms</text>
<rect x="330" y="150" width="2.4" height="13" fill="#0969DA"/>
<text x="338.4" y="161.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">2.0 ms</text>
<text x="936.0" y="147.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="end">176 times faster</text>
<line x1="24" y1="176" x2="936" y2="176" stroke="#EAEEF2"/>
<text x="24.0" y="201.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="start">Answer pack, p95</text>
<rect x="330" y="186" width="420.0" height="13" fill="#8C959F"/>
<text x="756.0" y="197.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">379 ms</text>
<rect x="330" y="204" width="41.0" height="13" fill="#0969DA"/>
<text x="377.0" y="215.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">37 ms</text>
<text x="936.0" y="201.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="end">10 times faster</text>
<line x1="24" y1="230" x2="936" y2="230" stroke="#EAEEF2"/>
<text x="24.0" y="255.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="start">Answer pack through the MCP server, p95</text>
<rect x="330" y="240" width="420.0" height="13" fill="#8C959F"/>
<text x="756.0" y="251.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">371 ms</text>
<rect x="330" y="258" width="41.9" height="13" fill="#0969DA"/>
<text x="377.9" y="269.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">37 ms</text>
<text x="936.0" y="255.0" font-size="13" fill="#1F2328" font-weight="normal" text-anchor="end">10 times faster</text>
<line x1="24" y1="284" x2="936" y2="284" stroke="#EAEEF2"/>
