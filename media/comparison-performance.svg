<text x="685.6" y="413.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">42 MB</text>
<rect x="330" y="420" width="420.0" height="13" fill="#0969DA"/>
<text x="756.0" y="431.0" font-size="12" fill="#1F2328" font-weight="normal" text-anchor="start">51 MB</text>
