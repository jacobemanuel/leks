<svg xmlns="http://www.w3.org/2000/svg" width="820" height="666" viewBox="0 0 820 666" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Cost of the agent with LEKS as a share of the cost without it</title>
<desc id="desc">Cost of the agent with LEKS 3.0 as a share of its cost without LEKS, with 95% bootstrap intervals; below 1 is cheaper. Per right answer, 35 questions, sonnet: 0.72 (0.56 to 0.88); Working days, the bill, three days, a cold cache every morning: 0.85 (0.80 to 0.90); Working days, the time, the same three days: 0.86 (0.79 to 0.93); A small model as the agent, haiku, per right answer: 0.49 (0.27 to 0.81); per right answer by model and effort: sonnet, low: 0.58 (0.28 to 0.89); sonnet, medium: 0.45 (0.16 to 0.80); sonnet, high: 0.75 (0.59 to 0.90); sonnet, xhigh: 0.50 (0.27 to 0.73); sonnet, max: 0.85 (0.62 to 1.15); opus, low: 0.66 (0.33 to 0.94); opus, medium: 0.77 (0.60 to 0.92); opus, high: 0.77 (0.49 to 1.05); opus, max: 0.85 (0.70 to 1.03).</desc>
<rect x="0.5" y="0.5" width="819" height="665" fill="#FFFFFF" stroke="#D0D7DE"/>
